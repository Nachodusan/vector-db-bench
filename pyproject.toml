[project]
name = "vector-db-bench"
version = "0.1.0"
description = "Comparing vector databases at default settings measures the defaults. Sweeps ef_search, measures recall against exact brute force, and compares latency at matched recall."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "qdrant-client>=1.12",
    "chromadb>=1.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
